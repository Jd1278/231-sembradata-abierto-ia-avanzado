apiVersion: apps/v1
kind: Deployment
metadata:
  name: sembradata-web
  labels:
    app: sembradata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sembradata-web
  template:
    metadata:
      labels:
        app: sembradata-web
    spec:
      containers:
        - name: sembradata
          image: sembradata-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sembradata-secrets
                  key: supabase-url
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: sembradata-secrets
                  key: supabase-anon-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sembradata-web
spec:
  selector:
    app: sembradata-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
