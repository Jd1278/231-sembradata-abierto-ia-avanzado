apiVersion: apps/v1
kind: Deployment
metadata:
  name: sembradata-web
  labels:
    app: sembradata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sembradata-web
  template:
    metadata:
      labels:
        app: sembradata-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: sembradata
          image: sembradata-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NITRO_PORT
              value: "3000"
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sembradata-secrets
                  key: supabase-url
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: sembradata-secrets
                  key: supabase-anon-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sembradata-web
  labels:
    app: sembradata
spec:
  selector:
    app: sembradata-web
  ports:
    - port: 80
      targetPort: 3000
      name: http
  type: ClusterIP
