services:
  - type: web
    name: sembradata
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_IDEAM_APP_TOKEN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      # Nota de Seguridad:
      # Los secretos de IA (GROQ_API_KEY, GEMINI_API_KEY) se configuran de forma
      # exclusiva en Supabase Edge Functions (server-side) y NUNCA en el runtime web.
