openapi: "3.1.0"
info:
  title: SembraData API
  description: >
    API REST y Edge Functions de la plataforma SembraData para predicción
    agroclimática, validación histórica e inteligencia artificial en Santander, Colombia.
  version: "0.6.0"
  contact:
    name: SembraData
    url: https://github.com/Jd1278/231-sembradata-abierto-ia-avanzado
  license:
    name: MIT

servers:
  - url: https://hhnbaxwbeywyriigcwav.supabase.co/rest/v1
    description: Supabase REST PostgREST API
  - url: https://hhnbaxwbeywyriigcwav.supabase.co/functions/v1
    description: Supabase Edge Functions Gateway

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /municipios:
    get:
      operationId: getMunicipios
      summary: Catálogo maestro de 87 municipios de Santander
      tags:
        - Geografía
      responses:
        "200":
          description: Lista de municipios de Santander con altitud y coordenadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Municipio"

  /rendimiento_historico:
    get:
      operationId: getRendimientoHistorico
      summary: Series históricas oficiales observadas (EVA / MinAgricultura)
      tags:
        - Datos Históricos
      parameters:
        - name: municipio_id
          in: query
          required: true
          schema:
            type: string
        - name: cultivo_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Observaciones históricas oficiales de rendimiento y superficie
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RendimientoHistorico"

  /predicciones_agroclimaticas:
    get:
      operationId: getPrediccionesAgroclimaticas
      summary: Pronósticos agroclimáticos estadísticos versionados (Theil-Sen)
      tags:
        - Predicciones
      parameters:
        - name: municipio_id
          in: query
          required: false
          schema:
            type: string
        - name: cultivo_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Pronósticos con intervalos de predicción al 80% y 95%
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrediccionAgroclimatica"

  /crop_climate_requirements:
    get:
      operationId: getCropRequirements
      summary: Requerimientos agroclimáticos oficiales (Cenicafé / Fedecacao / AGROSAVIA)
      tags:
        - Agronomía
      responses:
        "200":
          description: Rangos óptimos de temperatura, precipitación, altitud y pH
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CropClimateRequirement"

  /chat:
    post:
      operationId: postChatMessage
      summary: Asistente Agroclimático Trazable (Groq + Motor Determinista)
      tags:
        - Edge Functions / Chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  maxLength: 2000
                sessionId:
                  type: string
      responses:
        "200":
          description: Respuesta estructurada con afirmaciones verificadas y fuentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotResponse"
        "403":
          description: Origen no permitido por política CORS

  /gemini-assessment:
    post:
      operationId: postGeminiAssessment
      summary: Evaluación Cualitativa de Consistencia Agronómica (Gemini 2.0 Flash)
      tags:
        - Edge Functions / IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "200":
          description: Evaluación agronómica cualitativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentOutput"
        "403":
          description: Origen no permitido por política CORS

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey

  schemas:
    Municipio:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        departamento:
          type: string
          example: Santander
        latitud:
          type: number
        longitud:
          type: number
        altitud_msnm:
          type: number
        zone_agroecologica:
          type: string

    RendimientoHistorico:
      type: object
      properties:
        id:
          type: string
        municipio_id:
          type: string
        cultivo_id:
          type: string
        anio:
          type: integer
        rendimiento_ton_ha:
          type: number
        superficie_ha:
          type: number

    PrediccionAgroclimatica:
      type: object
      properties:
        id:
          type: string
        municipio_id:
          type: string
        cultivo_id:
          type: string
        anio_objetivo:
          type: integer
        rendimiento_estimado:
          type: number
        limite_inferior_80:
          type: number
        limite_superior_80:
          type: number
        limite_inferior_95:
          type: number
        limite_superior_95:
          type: number
        modelo_nombre:
          type: string
        modelo_version:
          type: string
        status:
          type: string

    CropClimateRequirement:
      type: object
      properties:
        crop_id:
          type: string
        temperature_optimal_min_c:
          type: number
        temperature_optimal_max_c:
          type: number
        precipitation_optimal_min_mm:
          type: number
        precipitation_optimal_max_mm:
          type: number
        altitude_optimal_min_m:
          type: number
        altitude_optimal_max_m:
          type: number
        ph_optimal_min:
          type: number
        ph_optimal_max:
          type: number
        source:
          type: string

    ChatbotResponse:
      type: object
      properties:
        answer:
          type: string
        summary:
          type: string
        claims:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              claimType:
                type: string
                enum: [observed, forecast, model_estimate, agronomic_requirement, general_guidance]
              source:
                type: string
              value:
                type: number
              unit:
                type: string
              confidence:
                type: number
        recommendations:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              basis:
                type: array
                items:
                  type: string
              priority:
                type: string
        insufficientData:
          type: boolean
        needsHumanReview:
          type: boolean
        requestId:
          type: string
        latencyMs:
          type: number

    AssessmentInput:
      type: object
      required:
        - municipio
        - cultivo
        - predictedYield
        - modelName
        - climateSummary
        - cropRequirements
      properties:
        municipio:
          type: string
        cultivo:
          type: string
        predictedYield:
          type: number
        modelName:
          type: string

    AssessmentOutput:
      type: object
      properties:
        consistencyStatus:
          type: string
          enum: [valid, warning, invalid]
        adjustmentRecommendation:
          type: string
          enum: [none, review_required]
        explanation:
          type: string
        riskFactors:
          type: array
          items:
            type: string
        dataQualityNotes:
          type: array
          items:
            type: string
        requestId:
          type: string
