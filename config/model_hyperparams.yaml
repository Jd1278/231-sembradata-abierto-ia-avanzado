# SembraData - Hiperparametros de Modelos
# Configuracion de modelos predictivos y LLMs

# ── Modelo de Viabilidad ──
viability_model:
  type: gradient_boosting
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.1
  min_samples_split: 5
  min_samples_leaf: 3
  subsample: 0.8
  random_state: 42

# ── Modelo de Rendimiento ──
yield_model:
  type: random_forest
  n_estimators: 150
  max_depth: 12
  min_samples_split: 4
  min_samples_leaf: 2
  random_state: 42

# ── Modelo de Riesgo ──
risk_model:
  type: gradient_boosting
  n_estimators: 100
  max_depth: 8
  learning_rate: 0.05
  class_weight: balanced
  random_state: 42

# ── Configuracion de LLM ──
llm_config:
  model: supabase-edge-function
  max_tokens: 512
  temperature: 0.7
  top_p: 0.9

# ── Validacion Cruzada ──
validation:
  cv_folds: 5
  train_split: 0.8
  random_state: 42
  scoring: f1_weighted
